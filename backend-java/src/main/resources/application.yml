server:
  port: 3001

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:db}:${DB_PORT:3306}/${DB_NAME:ds_pt_dev}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:ds_user}
    password: ${DB_PASS:ds_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

cors:
  allowedOrigins: http://localhost:3000

jwt:
  secret: ${JWT_SECRET:change_this_to_secure_secret}
  expirationSeconds: ${JWT_EXP:3600}
